# Local run of the server container against the Postgres that client/web owns.
# Start the database first (from client/web):  pnpm db:start
# Then from server/:                            docker compose -f docker-compose.dev.yml up --build
services:
  server:
    build:
      context: .
    image: circadium-server:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_JDBC_URL: jdbc:postgresql://host.docker.internal:5433/circadium_dev
      DATABASE_USERNAME: circadium
      DATABASE_PASSWORD: circadium
    # host.docker.internal resolves to the host on Docker Desktop automatically;
    # this mapping makes the same compose work on Linux (CI) where it does not.
    extra_hosts:
      - "host.docker.internal:host-gateway"
