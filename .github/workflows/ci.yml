name: Client CI

# Type-check and test the pnpm workspace. Vercel's Git integration builds and deploys the web app, so CI
# does not: a production build also needs the deployment's env, which only Vercel has.
on:
  push:
    branches: [main, develop, 'feature/**']
    paths:
      - 'client/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'client/**'
      - '.github/workflows/ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # The version comes from the packageManager field in client/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json

      # Vercel builds on Node 24.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test
