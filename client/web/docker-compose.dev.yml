services:
  postgres:
    image: postgres:16-alpine
    container_name: circadium-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: circadium_dev
      POSTGRES_USER: circadium
      POSTGRES_PASSWORD: circadium

    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circadium -d circadium_dev || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
