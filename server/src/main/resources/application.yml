spring:
  application:
    name: server
  profiles:
    default: local
  datasource:
    url: ${DATABASE_JDBC_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Deliberate ceiling against Neon's connection budget; single instance today, so this is also the
      # global count. Session state must never be set here (connection-init-sql): staging/prod sit behind
      # PgBouncer transaction pooling, where it would not stick to this pool's logical connections.
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
  lifecycle:
    # The drain window for graceful shutdown must outlast the sync transaction's 60s timeout, so a deploy's
    # SIGTERM lets an in-flight sync commit instead of cutting it off. Fly's kill_timeout sits above this.
    timeout-per-shutdown-phase: 75s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: false

# The only session is provider sign-in's round trip (see SecurityConfig). SameSite=None: Apple returns the browser
# with a cross-site form POST, and browsers send Lax cookies only on cross-site GETs. The cookie is read only by the
# sign-in chain, where state, not SameSite, ties the callback to the browser that started it.
server:
  # Boot's default since 3.4; stated because the lifecycle timeout above is tuned to it.
  shutdown: graceful
  # The calendar bootstrap and a stale sync's 409 carry the whole calendar; the 409 is application/problem+json,
  # which the default list leaves out. No response reflects request input next to a secret (tokens travel in
  # cookies, and the mobile token pair answers a request carrying only credentials or a refresh token), so
  # compression gives BREACH nothing to measure.
  compression:
    enabled: true
    mime-types: application/json, application/problem+json
  servlet:
    session:
      timeout: 10m
      cookie:
        name: circadium_oauth
        http-only: true
        secure: true
        same-site: none

circadium:
  auth:
    issuer: ${AUTH_ISSUER}
    audience: circadium-api
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    allow-ephemeral-key: false
    # AUTH_COOKIE_DOMAIN is the parent domain of the web and API hosts. The name prefixes make the browser
    # enforce Secure (and, for __Host-, host-only on Path=/); see AuthCookieProperties.
    cookies:
      access-name: __Secure-circadium_access
      refresh-name: __Host-circadium_refresh
      domain: ${AUTH_COOKIE_DOMAIN}
      secure: true
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    resend-base-url: https://api.resend.com
    web-base-url: ${WEB_BASE_URL}
    security-from: Circadium <security@circadium.app>
    # No mailbox behind it on purpose: replies bounce, so support@ only gets mail people meant to send.
    account-from: Circadium <no-reply@circadium.app>
    support-address: support@circadium.app
    allow-logging-fallback: false
  oauth:
    # Every provider listed must be configured outside local. Narrow the list to roll a provider out (or back)
    # deliberately; the web's NEXT_PUBLIC_OAUTH_PROVIDERS must match.
    providers: ${OAUTH_PROVIDERS:google,microsoft,apple}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    microsoft:
      client-id: ${MICROSOFT_CLIENT_ID:}
      client-secret: ${MICROSOFT_CLIENT_SECRET:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}
    redirect-base-url: ${circadium.auth.issuer}
    web-completion-url: ${circadium.mail.web-base-url}/auth/oauth/complete
    mobile-completion-url: circadium://auth/oauth/complete
  cors:
    allowed-origins: ${circadium.mail.web-base-url}
  # New passwords are looked up in Have I Been Pwned's range API (k-anonymity: only 5 hex characters of the
  # password's SHA-1 leave the server). Unreachable means the password is accepted (see PwnedPasswordsClient).
  passwords:
    pwned:
      enabled: true
      base-url: https://api.pwnedpasswords.com
  # Google Maps Platform (Places New + Routes), one key for both. Optional in every profile:
  # without it the location/travel endpoints answer 503 maps_not_configured, so a deploy is
  # never coupled to the Fly secret being set first.
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  # Erases a deleted account's PostHog person (see PosthogProperties). Optional: both blank turns it off.
  analytics:
    posthog:
      personal-api-key: ${POSTHOG_PERSONAL_API_KEY:}
      project-id: ${POSTHOG_PROJECT_ID:}
      api-host: https://eu.posthog.com

# Metrics stay inside the process: nothing scrapes them, and over HTTP every signed-in user could read them.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}

# Without it the docs list every response body as */*; every endpoint here answers JSON.
springdoc:
  default-produces-media-type: application/json

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5433/circadium_dev}
    username: ${DATABASE_USERNAME:circadium}
    password: ${DATABASE_PASSWORD:circadium}
# Plain-HTTP localhost cannot hold a SameSite=None cookie (it needs Secure). Apple sign-in cannot run locally
# anyway: Apple accepts only HTTPS return URLs on a real domain.
server:
  servlet:
    session:
      cookie:
        secure: false
        same-site: lax
circadium:
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:8080}
    allow-ephemeral-key: true
    # Plain-HTTP localhost cannot hold Secure cookies, so the names go without the prefixes.
    cookies:
      access-name: circadium_access
      refresh-name: circadium_refresh
      domain: ""
      secure: false
  mail:
    web-base-url: ${WEB_BASE_URL:http://localhost:3000}
    allow-logging-fallback: true
management:
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: staging
server:
  forward-headers-strategy: native
circadium:
  auth:
    # Prod's access cookie is scoped to circadium.app, so browsers also send it to the hosts under
    # staging.circadium.app. Distinct names keep each environment reading only its own tokens.
    cookies:
      access-name: __Secure-circadium_staging_access
      refresh-name: __Host-circadium_staging_refresh
logging:
  structured:
    format:
      console: ecs
sentry:
  environment: ${SENTRY_ENVIRONMENT:staging}

---
spring:
  config:
    activate:
      on-profile: prod
server:
  forward-headers-strategy: native
logging:
  structured:
    format:
      console: ecs
sentry:
  environment: ${SENTRY_ENVIRONMENT:prod}
