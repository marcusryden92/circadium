# Fly.io production deployment for the Circadium server, served as api.circadium.app.
# Deployed from main by server-ci.yml (`flyctl deploy -c fly.prod.toml`). The shape matches fly.toml
# (staging); the reasons for each setting are given there.
app = "circadium-server"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "bluegreen"

[env]
  # Non-secret config. Everything else is a Fly secret.
  SPRING_PROFILES_ACTIVE = "prod"
  # The sign-in providers offered; each one listed needs its credentials as Fly secrets or startup fails.
  # Must match NEXT_PUBLIC_OAUTH_PROVIDERS on the prod Vercel project.
  OAUTH_PROVIDERS = "google"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine, always on: the rate limiter and the sign-in session live in memory.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/actuator/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "40s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
